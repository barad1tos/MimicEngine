repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ['--branch', 'main']
        stages: [pre-commit, commit-msg]

  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.22.0
    hooks:
      - id: zizmor
        args: ['--min-severity', 'medium']

  - repo: local
    hooks:
      - id: guard-linter-configs
        name: Guard quality-gate configs
        entry: scripts/guard-linter-configs.sh
        language: script
        files: ^(eslint\.config\.ts|\.prettierrc\.json|vitest\.config\.ts|codecov\.yml)$
      - id: eslint
        name: ESLint (zero warnings)
        entry: pnpm lint
        language: system
        types_or: [ts, tsx]
        pass_filenames: false
      - id: typecheck
        name: TypeScript
        entry: pnpm typecheck
        language: system
        types_or: [ts, tsx]
        pass_filenames: false
      - id: prettier
        name: Prettier
        entry: pnpm format:check
        language: system
        pass_filenames: false
