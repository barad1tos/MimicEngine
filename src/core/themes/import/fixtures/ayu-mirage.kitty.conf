# ═══════════════════════════════════════════════════════════════════════════
# Kitty Configuration - Converted from Ghostty
# ═══════════════════════════════════════════════════════════════════════════

# ─── Ayu Mirage Theme (Inline) ──────────────────────────────────────────────
foreground           #cbccc6
background           #1f2430
selection_foreground #cbccc6
selection_background #34455a
cursor               #ffcc66
cursor_text_color    #1f2430

# Black
color0  #191e2a
color8  #686868

# Red
color1  #ed8274
color9  #f28779

# Green
color2  #a6cc70
color10 #bae67e

# Yellow
color3  #fad07b
color11 #ffd580

# Blue
color4  #6dcbfa
color12 #73d0ff

# Magenta
color5  #cfbafa
color13 #d4bfff

# Cyan
color6  #90e1c6
color14 #95e6cb

# White
color7  #c7c7c7
color15 #ffffff

# ─── Window ─────────────────────────────────────────────────────────────────
initial_window_width  170c
initial_window_height 35c
remember_window_size  no

# macOS-specific window styling
macos_titlebar_color        background
macos_show_window_title_in  none
hide_window_decorations     titlebar-only
macos_window_resizable      yes

# ─── Font ───────────────────────────────────────────────────────────────────
font_family      MesloLGS Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# Thicken font strokes on macOS (similar to font-thicken=true)
macos_thicken_font 0.5

# Disable ligatures (equivalent to font-feature=-liga,-calt,-dlig)
disable_ligatures always

# ─── Transparency & Effects ─────────────────────────────────────────────────
background_opacity 0.90
background_blur    20

# ─── Cursor ─────────────────────────────────────────────────────────────────
cursor_shape          block
cursor_blink_interval 0.5

# ─── Padding ────────────────────────────────────────────────────────────────
# Format: top right bottom left (or single value for all)
window_padding_width 10 15 10 15

# ─── Behavior ───────────────────────────────────────────────────────────────
wheel_scroll_multiplier   0.5
copy_on_select            clipboard
confirm_os_window_close   0

# ─── Tab Bar ────────────────────────────────────────────────────────────────
tab_bar_edge          bottom
tab_bar_style         powerline
tab_powerline_style   slanted

# ─── Keybindings ────────────────────────────────────────────────────────────
# Copy last command output (requires shell integration)
map ctrl+shift+b show_last_command_output

# Send escape sequences (equivalent to Ghostty text: bindings)
map alt+b        send_text all \x1bb
map shift+enter  send_text all \x1b\r

# Note: Quick Terminal (alt+shift+t) handled by Hammerspoon
# Note: Command Palette not available in Kitty

# ─── Splits (Windows in Kitty terminology) ──────────────────────────────────
# Horizontal split (like iTerm2/Ghostty cmd+d)
map cmd+d launch --location=vsplit --cwd=current

# Vertical split (like iTerm2 cmd+shift+d)
map cmd+shift+d launch --location=hsplit --cwd=current

# Navigate between splits
map cmd+alt+left neighboring_window left
map cmd+alt+right neighboring_window right
map cmd+alt+up neighboring_window up
map cmd+alt+down neighboring_window down

# Resize splits
map cmd+shift+left resize_window narrower
map cmd+shift+right resize_window wider
map cmd+shift+up resize_window taller
map cmd+shift+down resize_window shorter

# Close split
map cmd+w close_window
