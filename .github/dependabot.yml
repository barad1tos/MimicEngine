version: 2
# Each ecosystem lands as ONE grouped PR, and the ecosystems run three hours
# apart. `main` requires an up-to-date branch, between scheduled runs
# Dependabot rebases only on conflicts, and it ignores `@dependabot rebase`
# from github-actions[bot] — so a second PR open at the same time would stay
# BEHIND after the first one auto-merges (workflows/dependabot-auto-merge.yml).
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00' # UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels: [dependencies, github-actions]
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00' # UTC
    cooldown:
      default-days: 7
      semver-major-days: 7
    open-pull-requests-limit: 5
    labels: [dependencies, npm]
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm:
        patterns: ['*']
