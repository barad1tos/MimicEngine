name: CI

# No paths-ignore here on purpose: `gate` is the required branch-protection
# check, and a filtered-out workflow would leave PRs waiting on it forever.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tier 1: cheap file-level gates, no toolchain needed.
  lint-files:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trailing whitespace
        run: |
          if git grep -In '[[:blank:]]$' -- ':!*.png' ':!*.zip'; then
            echo "::error::Trailing whitespace found"
            exit 1
          fi
      - name: Merge conflict markers
        run: |
          if git grep -In -e '^<<<<<<< ' -e '^>>>>>>> '; then
            echo "::error::Merge conflict markers found"
            exit 1
          fi
      - name: Private keys
        run: |
          if git grep -In 'BEGIN.*\(RSA \|DSA \|EC \|OPENSSH \)\?PRIVATE KE[Y]'; then
            echo "::error::Private key material found"
            exit 1
          fi
      - name: Large files (>500KB)
        run: |
          large=$(find . -path ./.git -prune -o -type f -size +500k -print)
          if [ -n "$large" ]; then
            echo "::error::Files over 500KB: $large"
            exit 1
          fi
      - name: JSON validity
        run: |
          git ls-files '*.json' | while read -r f; do
            python3 -m json.tool "$f" > /dev/null || { echo "::error::Invalid JSON: $f"; exit 1; }
          done
      - name: YAML validity
        run: |
          git ls-files '*.yml' '*.yaml' | while read -r f; do
            python3 -c "import yaml, sys; yaml.safe_load(open(sys.argv[1]))" "$f" \
              || { echo "::error::Invalid YAML: $f"; exit 1; }
          done

  # Tier 1: the workflows themselves are scanned.
  gha-security:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: zizmor
        run: uvx zizmor --min-severity medium .

  # Tier 2: formatting, lint, types — all zero-tolerance.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Prettier
        run: pnpm format:check
      - name: ESLint (zero warnings)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

  # Tier 2: tests with coverage thresholds enforced by Vitest.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Vitest with coverage gate
        run: pnpm test:coverage
      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage/lcov.info
          fail_ci_if_error: true

  # Tier 3: production build per browser target, artifact integrity, size budget.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build extension
        run: pnpm wxt build -b ${{ matrix.browser }}
      - name: Install Playwright Chromium
        if: matrix.browser == 'chrome'
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser final-paint smoke
        if: matrix.browser == 'chrome'
        run: pnpm exec playwright test
      - name: Verify manifest integrity
        if: matrix.browser == 'chrome'
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const dir = ".output/chrome-mv3";
            const manifest = JSON.parse(fs.readFileSync(`${dir}/manifest.json`, "utf8"));
            const assert = (cond, msg) => {
              if (!cond) { console.error(`::error::${msg}`); process.exit(1); }
            };
            assert(manifest.manifest_version === 3, "manifest_version must be 3");
            assert(
              fs.existsSync(`${dir}/${manifest.background.service_worker}`),
              "background service worker file missing from build output",
            );
            for (const script of manifest.content_scripts ?? []) {
              for (const file of script.js ?? []) {
                assert(fs.existsSync(`${dir}/${file}`), `content script missing: ${file}`);
              }
            }
            assert(
              fs.existsSync(`${dir}/${manifest.action.default_popup}`),
              "popup html missing from build output",
            );
          '
      - name: Bundle size budget (5MB)
        run: |
          size_kb=$(du -sk .output | cut -f1)
          echo "Bundle size: ${size_kb}KB"
          if [ "$size_kb" -gt 5120 ]; then
            echo "::error::Bundle exceeds 5MB budget: ${size_kb}KB"
            exit 1
          fi
      - name: Package zip
        run: pnpm wxt zip -b ${{ matrix.browser }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: palette-mimicry-${{ matrix.browser }}
          path: .output/*.zip

  # Tier 2: the Go native-messaging host — format, vet, staticcheck, tests
  # with a coverage gate, and a cross-OS build smoke test.
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: host/go.mod
          cache: true
          # host/go.mod has no dependencies (stdlib-only) so there is no
          # go.sum for the default `**/go.sum` cache-key lookup to find;
          # point it at go.mod instead so `cache: true` has a real file to
          # hash rather than silently finding nothing.
          cache-dependency-path: host/go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needs to be run on:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        # Pinned to 2024.1.1 (v0.5.1), not the newer 2026.1 (v0.7.0):
        # v0.7.0's own go.mod requires go >= 1.25, and GOTOOLCHAIN is
        # "local" on this runner (matching host/go.mod's `go 1.22`, which
        # setup-go installed exactly) — `go install` of v0.7.0 fails outright
        # rather than silently upgrading. v0.5.1 requires only go >= 1.22.1,
        # so it installs and runs on the same Go 1.22 toolchain the rest of
        # this job builds and tests with. Confirmed via each release's
        # go.mod on https://github.com/dominikh/go-tools.
        run: |
          GOBIN="${RUNNER_TEMP}/gobin" go install honnef.co/go/tools/cmd/staticcheck@v0.5.1 # 2024.1.1
          "${RUNNER_TEMP}/gobin/staticcheck" ./...
      - name: Test with coverage gate (>=85% statements)
        run: |
          go test ./... -race -coverprofile=coverage.out
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Total statement coverage: ${total}%"
          awk -v total="$total" 'BEGIN {
            if (total + 0 < 85) {
              print "::error::coverage " total "% is below the 85% gate";
              exit 1;
            }
          }'
      - name: Cross-compile smoke (darwin/linux/windows)
        run: |
          set -e
          for goos in darwin linux windows; do
            echo "::group::GOOS=${goos}"
            # Trailing slash: ./... matches multiple packages (only one of
            # them, cmd/mimicengine-host, is a main package), and `go build
            # -o` requires a directory target once more than one package is
            # in play.
            mkdir -p "${RUNNER_TEMP}/smoke-${goos}"
            GOOS="$goos" GOARCH=amd64 CGO_ENABLED=0 go build -o "${RUNNER_TEMP}/smoke-${goos}/" ./...
            echo "::endgroup::"
          done

  # Tier 2: validate the host's goreleaser config and a full snapshot build
  # (every OS/arch, archives, universal binary) without publishing anything.
  host-goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: host/go.mod
          # No module cache here (unlike the `host` job): this job invokes
          # goreleaser-action, and zizmor's cache-poisoning audit flags
          # module caching in any job that touches a runtime-artifact
          # publisher, even with --skip=publish. Module cache buys nothing
          # anyway — host/go.mod has zero external dependencies.
          cache: false
      - name: goreleaser check
        # Informational, not gating: `check` hard-fails on ANY deprecated
        # field, and this config deliberately keeps the deprecated `brews:`
        # publisher — its replacement, `homebrew_casks`, is macOS-only,
        # which would silently drop the Linux Homebrew support the design
        # spec requires (docs/superpowers/specs/2026-08-18-native-messaging-
        # design.md, "Install & distribution": "Homebrew tap ... (macOS +
        # Linux)"). Verified locally: `goreleaser release --snapshot` still
        # renders a correct on_macos/on_linux formula despite the warning.
        # The snapshot release step below is the real functional gate.
        continue-on-error: true
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.1
          workdir: host
          args: check
      - name: goreleaser snapshot release (no publish)
        # release, not build: exercises archives, checksums, and the brew/
        # scoop manifest templates too, not just the cross-compile step.
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.1
          workdir: host
          args: release --snapshot --clean --skip=publish,announce,validate

  # Single required check: pass only when every needed job succeeded or was skipped.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [lint-files, gha-security, quality, test, build, host, host-goreleaser]
    if: always()
    steps:
      - name: Verify all jobs passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$RESULTS" | jq -r \
            'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key')
          if [ -n "$failed" ]; then
            echo "::error::Failed jobs: $failed"
            exit 1
          fi
