name: CI

on:
  push:
    branches: [main]
    paths-ignore: &skip-paths
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore: *skip-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tier 1: cheap file-level gates, no toolchain needed.
  lint-files:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trailing whitespace
        run: |
          if git grep -In '[[:blank:]]$' -- ':!*.png' ':!*.zip'; then
            echo "::error::Trailing whitespace found"
            exit 1
          fi
      - name: Merge conflict markers
        run: |
          if git grep -In -e '^<<<<<<< ' -e '^>>>>>>> '; then
            echo "::error::Merge conflict markers found"
            exit 1
          fi
      - name: Private keys
        run: |
          if git grep -In 'BEGIN.*\(RSA \|DSA \|EC \|OPENSSH \)\?PRIVATE KE[Y]'; then
            echo "::error::Private key material found"
            exit 1
          fi
      - name: Large files (>500KB)
        run: |
          large=$(find . -path ./.git -prune -o -type f -size +500k -print)
          if [ -n "$large" ]; then
            echo "::error::Files over 500KB: $large"
            exit 1
          fi
      - name: JSON validity
        run: |
          git ls-files '*.json' | while read -r f; do
            python3 -m json.tool "$f" > /dev/null || { echo "::error::Invalid JSON: $f"; exit 1; }
          done
      - name: YAML validity
        run: |
          git ls-files '*.yml' '*.yaml' | while read -r f; do
            python3 -c "import yaml, sys; yaml.safe_load(open(sys.argv[1]))" "$f" \
              || { echo "::error::Invalid YAML: $f"; exit 1; }
          done

  # Tier 1: the workflows themselves are scanned.
  gha-security:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: zizmor
        run: uvx zizmor --min-severity medium .

  # Tier 2: formatting, lint, types — all zero-tolerance.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Prettier
        run: pnpm format:check
      - name: ESLint (zero warnings)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

  # Tier 2: tests with coverage thresholds enforced by Vitest.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Vitest with coverage gate
        run: pnpm test:coverage

  # Tier 3: production build, artifact integrity, size budget.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build extension
        run: pnpm build
      - name: Verify manifest integrity
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const dir = ".output/chrome-mv3";
            const manifest = JSON.parse(fs.readFileSync(`${dir}/manifest.json`, "utf8"));
            const assert = (cond, msg) => {
              if (!cond) { console.error(`::error::${msg}`); process.exit(1); }
            };
            assert(manifest.manifest_version === 3, "manifest_version must be 3");
            assert(
              fs.existsSync(`${dir}/${manifest.background.service_worker}`),
              "background service worker file missing from build output",
            );
            for (const script of manifest.content_scripts ?? []) {
              for (const file of script.js ?? []) {
                assert(fs.existsSync(`${dir}/${file}`), `content script missing: ${file}`);
              }
            }
            assert(
              fs.existsSync(`${dir}/${manifest.action.default_popup}`),
              "popup html missing from build output",
            );
          '
      - name: Bundle size budget (5MB)
        run: |
          size_kb=$(du -sk .output/chrome-mv3 | cut -f1)
          echo "Bundle size: ${size_kb}KB"
          if [ "$size_kb" -gt 5120 ]; then
            echo "::error::Bundle exceeds 5MB budget: ${size_kb}KB"
            exit 1
          fi
      - name: Package zip
        run: pnpm zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: palette-mimicry-chrome
          path: .output/*.zip

  # Single required check: pass only when every needed job succeeded or was skipped.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [lint-files, gha-security, quality, test, build]
    if: always()
    steps:
      - name: Verify all jobs passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$RESULTS" | jq -r \
            'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key')
          if [ -n "$failed" ]; then
            echo "::error::Failed jobs: $failed"
            exit 1
          fi
