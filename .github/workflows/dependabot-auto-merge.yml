name: Dependabot auto-merge

# Dependabot no longer merges its own PRs: `@dependabot merge` was removed on
# 2026-01-27. This queues GitHub's native auto-merge on each of them, so a PR
# lands by itself once the required `gate` check passes on an up-to-date
# branch. Dependabot rebases auto-merge PRs that fall behind main (observed in
# ayu-jetbrains; not a documented rebase trigger); if one stays BEHIND,
# comment `@dependabot rebase` on it.
on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # The PR author, not github.actor: the actor is whoever caused this event,
    # and zizmor's bot-conditions audit flags actor checks as spoofable. The
    # repository pin keeps forks from running it.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      && github.repository == 'barad1tos/MimicEngine'
    # Enabling auto-merge needs both. GitHub then merges as
    # github-actions[bot], so that merge starts no push workflows on main
    # (e.g. CI, CodeQL, Semgrep).
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Queue auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"
