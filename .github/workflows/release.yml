name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Release does not trust older CI runs: re-verify everything at the tag.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Prettier
        run: pnpm format:check
      - name: ESLint (zero warnings)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests with coverage gate
        run: pnpm test:coverage
      - name: Build
        run: pnpm build

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Package zips
        run: pnpm zip && pnpm zip:firefox
      - name: GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v2
        with:
          files: .output/*.zip
          generate_release_notes: true
          draft: false
